name: Erinnerungen

on:
  schedule:
    - cron: "0 5 * * 1"   # Montag 7 Uhr Sommerzeit
    - cron: "0 6 * * 1"   # Montag 7 Uhr Winterzeit
  workflow_dispatch:
    inputs:
      test:
        description: "Testnachricht sofort senden"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund
      - name: Termine prüfen und Push senden
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test && '1' || '0' }}
          SCHED: ${{ github.event.schedule }}
        run: node erinnerungen.mjs
      - name: Zeitplan aktiv halten
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable erinnerungen.yml --repo ${{ github.repository }} || true
