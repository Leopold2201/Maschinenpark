<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maschinenpark</title>
<meta name="theme-color" content="#23331f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maschinen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: Werkstatt-Tafel – Kopfband, Terminliste vor Maschinenkarten, Details als Bogen von unten */
:root{
  --bg:#f1f3ec; --surface:#fbfcf8; --sunk:#e7eadf; --ink:#1c2318; --muted:#5a6453; --line:#d6dbcc;
  --accent:#2d5a32; --accent-ink:#ffffff; --band:#23331f; --band-ink:#eef2e6;
  --ok:#2e6a38; --ok-bg:#dbebd8; --warn:#9a5c00; --warn-bg:#fbe9c9; --bad:#ae2a20; --bad-bg:#f7dcd8;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121610; --surface:#1a1f18; --sunk:#161b14; --ink:#e6eadf; --muted:#9ba393; --line:#2d3529;
  --accent:#86bd84; --accent-ink:#0f170e; --band:#0c100b; --band-ink:#e6eadf;
  --ok:#93cf92; --ok-bg:#1c3220; --warn:#f0b65a; --warn-bg:#3a2b10; --bad:#f28e84; --bad-bg:#3f1a16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121610; --surface:#1a1f18; --sunk:#161b14; --ink:#e6eadf; --muted:#9ba393; --line:#2d3529;
  --accent:#86bd84; --accent-ink:#0f170e; --band:#0c100b; --band-ink:#e6eadf;
  --ok:#93cf92; --ok-bg:#1c3220; --warn:#f0b65a; --warn-bg:#3a2b10; --bad:#f28e84; --bad-bg:#3f1a16; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.band{background:var(--band);color:var(--band-ink)}
header.band .wrap{padding-block:14px 18px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(2.6rem,13vw,4.8rem);line-height:1;flex:1 1 auto;min-width:0;margin:0;white-space:nowrap;letter-spacing:.01em;text-wrap:balance}
.brand{flex:1 1 100%;display:flex;align-items:flex-start;padding-top:4px;justify-content:space-between;gap:16px;min-width:0}
.brand img{height:118px;width:auto;object-fit:contain;flex:0 0 auto}
@media (min-width:700px){.brand img{height:160px}}
#pushBtn.on{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.signatur{text-align:center;color:var(--muted);font-size:.82rem;letter-spacing:.04em;margin:8px 0 0}
.tally{display:flex;gap:8px;flex-wrap:wrap}
.tally div{border:1px solid color-mix(in srgb,var(--band-ink) 25%,transparent);border-radius:8px;padding:6px 12px;min-width:84px}
.tally b{display:block;font-family:var(--f-display);font-size:1.5rem;line-height:1.1}
.tally span{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;opacity:.8}
main .wrap{padding-block:20px 60px;display:grid;gap:28px}
h2{font-family:var(--f-display);font-weight:700;font-size:1.35rem;margin:0;letter-spacing:.02em}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 14px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent}
button.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.mcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
/* Termine */
.due{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.due li{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;padding:10px 14px 10px 0;border-top:1px solid var(--line);cursor:pointer}
.due li:first-child{border-top:0}
.due .stripe{align-self:stretch}
.due .what{min-width:0}
.due .what b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.due .what small{color:var(--muted)}
.empty{padding:16px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);background:var(--surface)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.none{background:var(--sunk);color:var(--muted)}
.s-ok{background:var(--ok)} .s-warn{background:var(--warn)} .s-bad{background:var(--bad)}
/* Maschinen */
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.viewnav{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.viewnav button{border:0;background:transparent;border-radius:9px;padding:10px;font-weight:700;font-family:var(--f-display);font-size:1.05rem;letter-spacing:.03em;color:var(--muted)}
.viewnav button.on{background:var(--accent);color:var(--accent-ink)}
.vgrid{display:grid;gap:28px;min-width:0}
.vgrid>section,#vLager{min-width:0}
.llist{display:grid;gap:8px}
.lrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 8px 8px 14px}
.lrow.low{border-color:color-mix(in srgb,var(--warn) 55%,var(--line))}
.linfo{flex:1 1 auto;min-width:0;background:none;border:0;padding:4px 0;text-align:left;font-weight:400;display:grid;gap:2px;justify-items:start}
.linfo b{overflow-wrap:anywhere}.linfo .lnotiz{font-style:italic;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.linfo small{color:var(--muted);overflow-wrap:anywhere}
.qty{flex:0 0 auto;display:flex;align-items:center;gap:6px}
.qty span{min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.qty button{width:38px;height:38px;padding:0;border-radius:50%;font-size:1.25rem;line-height:1}
.nachbox{background:var(--warn-bg);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.nachbox .nh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.nachbox ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.nachbox li{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.nachbox small{color:var(--muted)}
.mpick{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0;display:grid;gap:8px;background:var(--surface)}
.mpick input[type=search]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.mlist{max-height:240px;overflow:auto;display:grid;gap:10px;padding-right:4px}
.mg{display:grid;gap:6px}
.linkbtn.plain{color:var(--ink);font-weight:600;font-size:inherit;text-decoration:none}
.sechead.stack{flex-direction:column;align-items:flex-start;gap:8px}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:2px;flex:0 0 auto}
.seg button{border:0;background:transparent;border-radius:999px;padding:4px 11px;font-size:.8rem;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
main .wrap>section{min-width:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border-radius:999px;padding:7px 14px;font-weight:600;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.tab span{color:var(--muted);font-weight:500;margin-left:2px}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab.on span{color:inherit;opacity:.8}
.ghead{font-family:var(--f-display);font-size:1.1rem;margin:18px 0 8px;letter-spacing:.02em}
.ghead:first-child{margin-top:0}
.ghead span{color:var(--muted);font-weight:600;font-size:.95rem}
.toolbar input,.toolbar select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;cursor:pointer;text-align:left;font-weight:400}
.mcard:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.mcard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.mcard.is-ab{opacity:.62}
.tag.ab{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.toggle{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--muted);white-space:nowrap}
.mcard h3{font-family:var(--f-display);font-size:1.25rem;margin:0;line-height:1.1;min-width:0;overflow-wrap:anywhere}
.mcard .meta{color:var(--muted);font-size:.86rem}
.mcard .chips{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}
/* Kosten */
.costs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.bars{display:grid;gap:9px;margin-top:8px}
.bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;font-size:.9rem}
.bar .track{height:10px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:3px}
.bar .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1}
/* Bogen */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:18px;align-content:start}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:16px;max-height:88%}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-head h2{font-size:1.7rem;line-height:1.05}
dl.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:0}
dl.facts div{min-width:0} dl.facts dd{margin:2px 0 0;overflow-wrap:anywhere}
.status2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status2 .panel{display:grid;gap:6px}
.hist{list-style:none;margin:0;padding:0;display:grid}
.hist li{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.hist .d{color:var(--muted);font-size:.85rem;min-width:78px}
.hist .t{min-width:0;overflow-wrap:anywhere}
.hist .a{font-weight:600;text-align:right}
.hist .x{grid-column:2/4;justify-self:end}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);font-size:.8rem;font-weight:500;text-decoration:underline;cursor:pointer}
.linkbtn.armed{color:var(--bad);font-weight:600}
form{display:grid;gap:12px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.f{display:grid;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f input,.f select,.f textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%}
.f small{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.check{display:flex;gap:8px;align-items:center}
.note{font-size:.85rem;color:var(--muted)}
.err{color:var(--bad);font-size:.9rem}
@media (max-width:420px){.status2{grid-template-columns:1fr}h1{font-size:1.8rem}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
.panel.tuev{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.panel.tuev b{display:block;font-size:1.1rem}
.wlist{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.wlist li{display:grid;grid-template-columns:6px 1fr auto auto;gap:10px;align-items:center;padding:9px 12px 9px 0;border-top:1px solid var(--line)}
.wlist li:first-child{border-top:0}
.wlist .stripe{align-self:stretch}
.wlist .wn{min-width:0}.wlist .wn b{display:block}.wlist .wn small{color:var(--muted)}
.wlist .wd{font-size:.9rem}
@media (max-width:480px){.wlist li{grid-template-columns:6px 1fr auto}.wlist .wd{grid-column:2;grid-row:2;color:var(--muted);font-size:.85rem}.wlist .pill{grid-row:1/3;grid-column:3}}
.s-none{background:var(--line)}
.wrow{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end;padding:10px 0;border-top:1px solid var(--line)}
.wrow .wname{grid-column:1/3}.wrow .wmodus{grid-column:3/4}.wrow .wdel{grid-column:4;grid-row:1;padding-bottom:10px}
.wrow .wiv{grid-column:1/2}.wrow .wnext{grid-column:2/3}.wrow .wlast{grid-column:1/3}
.repbtn{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:12px 14px;border-radius:var(--r);font-weight:400}
.repbtn b{display:block}.repbtn small{display:block;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.repbtn .cnt{flex:0 0 auto;min-width:28px;text-align:center;border-radius:999px;background:var(--sunk);padding:2px 8px;font-weight:600}
.docs{display:grid;gap:4px}
.doclist{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.doclist li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.doclist li:first-child{border-top:0}
.doclist a{color:var(--accent);font-weight:600;overflow-wrap:anywhere;min-width:0}
.viewer{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.vbar{display:flex;align-items:center;gap:10px;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.vbar b{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vz{display:flex;gap:6px}.vz button{width:38px;height:38px;padding:0;border-radius:50%;font-size:1.2rem}
.vbody{flex:1 1 auto;overflow:auto;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;justify-items:center;align-content:start;background:var(--sunk);-webkit-overflow-scrolling:touch}
.vbody canvas,.vbody img{background:#fff;box-shadow:0 1px 4px rgb(0 0 0 / .2);max-width:none}
.vbody img{max-width:100%}
.docacts{display:flex;gap:14px;align-items:center}
.upl{cursor:pointer}
.doclink{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-align:left;overflow-wrap:anywhere;min-width:0;text-decoration:underline}
.doclink small{color:var(--muted);font-weight:400;text-decoration:none}
.docf{display:grid;gap:8px;margin-top:8px}
.docf input{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%}
.replist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.replist li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;justify-items:start}
.replist .rh{display:flex;gap:8px;align-items:center}.replist .d{color:var(--muted);font-size:.85rem}
.replist p{margin:0;overflow-wrap:anywhere}
.wrow .wlager{grid-column:1/-1}
.lager{display:block;width:max-content;margin-top:4px;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);color:var(--muted)}
.lager.ja{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.wrow .wteil{grid-column:1/3}.wrow .wmenge{grid-column:3/5}
.wrow .wfix{grid-column:3/4;align-self:center;color:var(--muted);font-size:.85rem}
@media (max-width:560px){.wrow{grid-template-columns:1fr 1fr}.wrow .wname,.wrow .wmodus,.wrow .wlast,.wrow .wteil,.wrow .wmenge,.wrow .wfix{grid-column:1/-1}.wrow .wiv{grid-column:1/2}.wrow .wnext{grid-column:2/3}.wrow .wdel{grid-column:1/-1;grid-row:auto;justify-self:start;padding:0}}
.wlist .teil{display:block;color:var(--ink)}.wlist .teil b{display:inline;font-weight:600;user-select:all}
fieldset.checks{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0;display:grid;gap:8px;background:var(--surface)}
fieldset.checks small{color:var(--muted)}
.hist li{grid-template-columns:auto 1fr auto}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}[hidden]{display:none!important}
.hbtn{background:transparent;color:var(--band-ink);border-color:color-mix(in srgb,var(--band-ink) 35%,transparent);font-size:.85rem;padding:7px 12px}
.hbtn.on{background:color-mix(in srgb,var(--band-ink) 14%,transparent)}
.foot{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px}
.foot #conn{flex:1 1 100%;margin:0}
.login{min-height:70vh;display:grid;place-items:center;padding-block:32px}
.login form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:14px}
.login h2{font-size:1.6rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--band);color:var(--band-ink);padding:12px 16px;border-radius:10px;z-index:40;max-width:min(92vw,520px);box-shadow:0 6px 24px rgb(0 0 0 / .25)}
.import{display:grid;gap:10px;justify-items:start}
</style>
</head>
<body>

<header class="band"><div class="wrap">
  <div class="brand">
    <h1>Maschinenpark</h1>
    <img id="logo" src="logo.png" alt="Logo des Betriebs" onerror="this.hidden=true">
  </div>
  <div class="tally" id="tally"></div>
</div></header>

<section class="login wrap" id="login" hidden>
  <form id="lf">
    <div><span class="label">Hof-Zugang</span><h2>Anmelden</h2></div>
    <label class="f"><span class="label">E-Mail</span><input id="l_mail" type="email" autocomplete="username" required></label>
    <label class="f"><span class="label">Passwort</span><input id="l_pw" type="password" autocomplete="current-password" required></label>
    <p class="err" id="lerr" hidden></p>
    <button class="primary" type="submit">Anmelden</button>

<script>
/* Hauptgruppen (Reiter) mit ihren Kategorien */
const GRUPPEN=[
  {id:"traktoren",name:"Traktoren",kats:["Traktor"]},

  {id:"geraete",name:"Geräte",kats:["Anhänger","Heu- & Futtergeräte","Bodenbearbeitung","Sätechnik","Düngung","Pflanzenschutz","Sonstige Geräte"]}
];
const ALT={"Futterernte":"Heu- & Futtergeräte","Sonstiges":"Sonstige Geräte"};
const katOf=m=>ALT[m.kategorie]||m.kategorie||"Sonstige Geräte";
const gruppeOf=m=>(GRUPPEN.find(g=>g.kats.includes(katOf(m)))||GRUPPEN[3]).id;
const KATS=GRUPPEN.flatMap(g=>g.kats);
const katOptions=sel=>GRUPPEN.map(g=>`<optgroup label="${g.name}">${g.kats.map(k=>`<option ${k===sel?"selected":""}>${k}</option>`).join("")}</optgroup>`).join("");
/* Standard-Wartung je Gruppe */
const STD_JE={traktoren:[["Motoröl",12],["Kraftstofffilter",12],["Getriebeöl",24],["Hydrauliköl",24],["Abschmieren",""]],
  autos:[["Motoröl",12],["Kraftstofffilter",24]],
  selbstfahrer:[["Motoröl",12],["Kraftstofffilter",12],["Getriebeöl",24],["Hydrauliköl",24],["Abschmieren",""]],
  geraete:[["Abschmieren",""]]};
const stdFuer=k=>(STD_JE[(GRUPPEN.find(g=>g.kats.includes(k))||GRUPPEN[3]).id]).map(([n,i])=>({id:uid(),name:n,intervall:i,naechste:""}));
let DUE="tuev"; /* startet immer mit TÜV */
let TAB="alle";try{TAB=localStorage.getItem("mp_tab")||"alle"}catch(_){}
const STD_PUNKTE=[["Motoröl",12],["Kraftstofffilter",12],["Getriebeöl",24],["Hydrauliköl",24],["Abschmieren",""]];
const ARTEN=["Wartung","Reparatur","TÜV / HU","Sonstiges"];
const S={m:[],e:[],l:[],ready:false,canWrite:true,open:null,db:null};
/* Lager */
const LKATS=["Öle & Fette","Filter","Ersatzteile","Sonstiges"];
const EINHEITEN=["Stk","l","kg","Kanister","Eimer","Packung"];
let VIEW="maschinen",LTAB="alle";
const nrm=t=>String(t||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const fmtN=n=>(Math.round((+n||0)*100)/100).toLocaleString("de-DE");
const knapp=a=>(+a.min>0)&&(+a.menge||0)<=(+a.min);
const mNamen=a=>{const n=(a.maschinen||[]).map(id=>(S.m.find(m=>m.id===id)||{}).name).filter(Boolean);return n.length?n.join(", "):(a.passt||"")};
const lagerZu=teil=>{const k=nrm(teil);return k?S.l.find(a=>nrm(a.teil)===k):null};
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse=s=>{if(!s)return null;const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d||1)};
const fmtD=s=>{const d=parse(s);return d?d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"}):"–"};
const fmtM=s=>{if(!s)return"–";const[y,m]=s.split("-");return `${m}/${y}`};
const addMonths=(s,n)=>{const d=parse(s);d.setMonth(d.getMonth()+Number(n));return iso(d)};
/* Wartung nur monatsgenau: "2026-10" → 10/26, fällig bis Monatsende */
const ym=s=>(s||"").slice(0,7);
const addYM=(s,n)=>{const[y,m]=ym(s).split("-").map(Number);const t=y*12+(m-1)+Number(n);return `${Math.floor(t/12)}-${String(t%12+1).padStart(2,"0")}`};
const fmtMY=s=>{if(!s)return"–";const[y,m]=ym(s).split("-");return `${m}/${y.slice(2)}`};
const dueW=s=>days(new Date(+ym(s).slice(0,4),+ym(s).slice(5,7),0));
const tuevEnd=s=>{if(!s)return null;const[y,m]=s.split("-").map(Number);return new Date(y,m,0)};
const days=d=>Math.round((d-today())/864e5);
const uid=()=>Math.random().toString(36).slice(2,9);
function lvl(d){if(d==null)return"none";if(d<0)return"bad";if(d<=30)return"warn";return"ok"}
function rel(d){if(d==null)return"kein Termin";if(d<0)return `${-d} Tage überfällig`;if(d===0)return"heute";if(d===1)return"morgen";if(d<=60)return `in ${d} Tagen`;return"in Ordnung"}
const ez=s=>s?(/^\d{4}-\d{2}-\d{2}$/.test(s)?fmtD(s):s):"";
/* TÜV gilt 2 Jahre, bei Pflanzenschutzspritzen 3 Jahre */
const tuevJahre=k=>(ALT[k]||k)==="Pflanzenschutz"?3:2;
const plusJ=(ym,j)=>ym?`${+ym.slice(0,4)+j}${ym.slice(4,7)}`:"";
const letzter=m=>m.letzterTuev||(m.tuevBis?`${+m.tuevBis.slice(0,4)-tuevJahre(m.kategorie)}${m.tuevBis.slice(4,7)}`:"");
const teilHint=n=>/motoröl/i.test(n)?"Ölfilter, z. B. 03L 115 562":/diesel|kraftstoff/i.test(n)?"Kraftstofffilter-Einsatz":/hydraulik/i.test(n)?"Hydraulikfilter":/getriebe/i.test(n)?"Getriebeölfilter, falls vorhanden":/luft/i.test(n)?"Luftfilter":"Filter oder Teilenummer";
const mengeHint=n=>/abschmier/i.test(n)?"z. B. Fett, Sorte":/öl/i.test(n)?"z. B. 4,3 l · 5W-30":"falls nötig";
/* Abschmieren: kein Intervall, nur „zuletzt gemacht“ */
const istAbschmieren=p=>/abschmier/i.test(p.name||"");
const ohneMenge=p=>istAbschmieren(p)||/diesel|kraftstoff/i.test(p.name||"");
const nurZuletzt=p=>istAbschmieren(p)||p.modus==="zuletzt";
const seit=s=>{const d=-days(parse(s));return d<=0?"heute":d===1?"gestern":d<60?`vor ${d} Tagen`:d<730?`vor ${Math.round(d/30.4)} Monaten`:`vor ${Math.round(d/365)} Jahren`};
const seitM=s=>{const[y,m]=ym(s).split("-").map(Number);const t=new Date();const n=(t.getFullYear()*12+t.getMonth())-(y*12+m-1);return n<=0?"diesen Monat":n===1?"letzten Monat":n<24?`vor ${n} Monaten`:`vor ${Math.floor(n/12)} Jahren`};
/* TÜV-pflichtig? Alte Einträge ohne Angabe gelten als ja. Neue Geräte (außer Anhänger) standardmäßig nein. */
const hatTuev=m=>m.tuevPflicht!==false;
const tuevStd=k=>!(GRUPPEN[3].kats.includes(k)&&k!=="Anhänger"&&k!=="Pflanzenschutz");
const fmtE=s=>!s?"–":s.length>7?fmtD(s):fmtM(s); /* Einträge: neu nur Monat/Jahr, alte mit Tag */
const istRep=e=>e.art==="Reparatur"||e.art==="Sonstiges";
const iv=n=>!n?"":n==1?"jeden Monat":`alle ${n} Monate`;

/* ältere Einträge mit einem einzigen Wartungstermin weiter anzeigen */
function punkte(m){
  if(Array.isArray(m.wartung))return m.wartung;
  return m.naechsteWartung||m.intervall?[{id:"allg",name:"Wartung allgemein",intervall:m.intervall||"",naechste:m.naechsteWartung||""}]:[];
}
function termine(m){
  const out=[];
  if(m.tuevBis&&!m.abgemeldet&&hatTuev(m))out.push({typ:"TÜV / HU",d:days(tuevEnd(m.tuevBis)),label:`Plakette bis ${fmtM(m.tuevBis)}`,kurz:fmtM(m.tuevBis)});
  punkte(m).forEach(p=>{if(p.naechste&&!nurZuletzt(p))out.push({typ:p.name,d:dueW(p.naechste),label:`fällig ${fmtMY(p.naechste)}`,kurz:fmtMY(p.naechste)})});
  return out;
}
const ORD={bad:0,warn:1,ok:2,none:3};
function worst(m){const t=termine(m);if(!t.length)return"none";return t.map(x=>lvl(x.d)).sort((a,b)=>ORD[a]-ORD[b])[0]}

function gruppiert(list,keyFn,order,card){
  const by={};list.forEach(m=>{(by[keyFn(m)]=by[keyFn(m)]||[]).push(m)});
  const keys=Object.keys(by).sort((a,b)=>{const i=order.indexOf(a),j=order.indexOf(b);return(i<0?99:i)-(j<0?99:j)});
  if(keys.length===1)return `<div class="grid">${by[keys[0]].map(card).join("")}</div>`;
  return keys.map(k=>`<h3 class="ghead">${esc(k)} <span>${by[k].length}</span></h3><div class="grid">${by[k].map(card).join("")}</div>`).join("");
}
/* Titel so groß wie möglich neben dem Logo, mittig auf Höhe des Ringelschwanzes */
function fitTitle(){
  const b=document.querySelector(".brand");if(!b)return;const h=b.querySelector("h1"),img=document.getElementById("logo");
  const lw=img&&!img.hidden?img.getBoundingClientRect().width:0,lh=img&&!img.hidden?img.getBoundingClientRect().height:0;
  const avail=b.clientWidth-lw-(lw?14:0);if(avail<=0)return;
  h.style.fontSize="100px";const r=document.createRange();r.selectNodeContents(h);const w=r.getBoundingClientRect().width||1;
  const f=Math.max(28,Math.min(96,Math.floor(100*avail/w*0.98)));
  h.style.fontSize=f+"px";h.style.marginTop=(lh?Math.max(0,Math.round(0.222*lh-0.56*f)):0)+"px";
}
addEventListener("resize",fitTitle);
document.getElementById("logo").addEventListener("load",fitTitle);
document.fonts&&document.fonts.ready.then(fitTitle);
setTimeout(fitTitle,0);

  const anz=k=>S.l.filter(a=>k==="alle"||(a.kat||"Sonstiges")===k).length;
  $("#ltabs").innerHTML=[["alle","Alle"],...LKATS.map(k=>[k,k])].map(([id,n])=>`<button role="tab" class="tab${LTAB===id?" on":""}" aria-selected="${LTAB===id}" data-ltab="${esc(id)}">${esc(n)} <span>${anz(id)}</span></button>`).join("");
  $("#lnach").innerHTML=nach.length?`<div class="nachbox"><div class="nh"><b>Nachbestellen (${nach.length})</b><button class="linkbtn" data-act="lcopy">Liste kopieren</button></div><ul>${nach.map(a=>`<li><button class="linkbtn plain" data-ledit="${esc(a.id)}">${esc(a.name)}</button>${a.teil?` <small>${esc(a.teil)}</small>`:""} <span class="pill warn">${fmtN(a.menge)} ${esc(a.einheit||"Stk")}</span></li>`).join("")}</ul></div>`:"";
  const q=nrm($("#lq").value);
  const list=S.l.filter(a=>(LTAB==="alle"||(a.kat||"Sonstiges")===LTAB)&&(!q||nrm([a.name,a.teil,a.ort,mNamen(a)].join(" ")).includes(q)))

  const row=a=>`<div class="lrow${knapp(a)?" low":""}"><button class="linfo" data-ledit="${esc(a.id)}"><b>${esc(a.name)}</b><small>${esc([a.teil,a.ort?"Lagerort: "+a.ort:"",mNamen(a)?"für "+mNamen(a):""].filter(Boolean).join(" · "))||"&nbsp;"}</small>${a.notiz?`<small class="lnotiz">${esc(a.notiz)}</small>`:""}${knapp(a)?`<span class="pill warn">nachbestellen</span>`:""}</button>
    <div class="qty">${S.canWrite?`<button aria-label="weniger" data-ldelta="-1" data-lid="${esc(a.id)}">−</button>`:""}<span><b>${fmtN(a.menge)}</b> ${esc(a.einheit||"Stk")}</span>${S.canWrite?`<button aria-label="mehr" data-ldelta="1" data-lid="${esc(a.id)}">+</button>`:""}</div></div>`;
  $("#llist").innerHTML=!S.ready?`<div class="empty">Lager wird geladen…</div>`:!S.l.length?`<div class="empty">Noch nichts im Lager. Tippe auf <b>+ Artikel</b> und leg zum Beispiel euer Motoröl an: Name, Menge in Litern und ab wie viel nachbestellt werden soll.</div>`:!list.length?`<div class="empty">Nichts gefunden.</div>`:
    (LTAB==="alle"?LKATS.map(k=>{const g=list.filter(a=>(a.kat||"Sonstiges")===k);return g.length?`<h3 class="ghead">${esc(k)} <span>${g.length}</span></h3><div class="llist">${g.map(row).join("")}</div>`:""}).join(""):`<div class="llist">${list.map(row).join("")}</div>`);
  $("#addL").disabled=!S.canWrite;
  if(S.open&&S.open.type==="lform"&&S.open.id&&!S.l.some(a=>a.id===S.open.id))closeSheet();

     ${a.passt?`<small>Bisher als Text: ${esc(a.passt)}</small>`:""}
   </fieldset>

  </div><p class="err" id="lferr" hidden></p><div class="row">${a.id?`<button type="button" class="danger" data-ldel="${esc(a.id)}" style="margin-right:auto">Löschen</button>`:""}<button class="primary" type="submit">Speichern</button></div></form>`);
  $("#l_msuche").addEventListener("input",e=>{const q=nrm(e.target.value);document.querySelectorAll("#l_mlist [data-mname]").forEach(l=>l.hidden=!!q&&!l.dataset.mname.includes(q));document.querySelectorAll("#l_mlist .mg").forEach(g=>g.hidden=![...g.querySelectorAll("[data-mname]")].some(l=>!l.hidden))});

      einheit:$("#l_einheit").value,min:$("#l_min").value===""?"":(+String($("#l_min").value).replace(",",".")||0),ort:$("#l_ort").value.trim(),maschinen:[...document.querySelectorAll(".l_m:checked")].map(c=>c.value),passt:a.passt||"",notiz:$("#l_notiz").value.trim(),aktualisiert:iso(new Date())};
    if(!body.name)return;const btn=ev.submitter;btn.disabled=true;
    try{if(a.id)await S.db.doc("lager/"+a.id).set(body);else await S.db.collection("lager").add(body);closeSheet()}
    catch(e){showErr("#lferr",e);btn.disabled=false}
  });

function render(){renderMasch();renderLager()}
function renderMasch(){
  const all=S.m.flatMap(m=>termine(m).filter(t=>DUE==="tuev"?t.typ==="TÜV / HU":t.typ!=="TÜV / HU").map(t=>({...t,m})));
  $("#dueTitle").textContent=DUE==="tuev"?"Anstehende TÜV-Termine":"Anstehende Wartungen";
  document.querySelectorAll("[data-due]").forEach(b=>{const on=b.dataset.due===DUE;b.classList.toggle("on",on);b.setAttribute("aria-checked",on)});
  const over=all.filter(t=>t.d<0).length, soon=all.filter(t=>t.d>=0&&t.d<=30).length;

/* Dateien (PDF/Fotos) direkt in der Datenbank: in Stücke à 700 KB geteilt, max. 8 MB */
const TEIL=700000;
const b64=buf=>{let s="";const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)};
document.addEventListener("change",async e=>{
  if(e.target.id!=="d_file"||!e.target.files[0])return;
  const f=e.target.files[0];e.target.value="";const m=S.m.find(x=>x.id===S.open?.id);if(!m)return;
  const st=$("#d_status");st.hidden=false;
  if(f.size>8*1024*1024){st.textContent="Die Datei ist größer als 8 MB. Bitte eine kleinere Datei nehmen oder als Link hinterlegen.";return}
  st.textContent="Wird hochgeladen…";
  try{
    const data=b64(await f.arrayBuffer());const fileId=uid()+uid();const n=Math.ceil(data.length/TEIL);
    for(let i=0;i<n;i++){await S.db.doc(`dateien/${fileId}_${i}`).set({i,data:data.slice(i*TEIL,(i+1)*TEIL)});st.textContent=`Wird hochgeladen… ${Math.round((i+1)/n*100)} %`}
    const name=f.name.replace(/\.[^.]+$/,"").replace(/[_]+/g," ").slice(0,80)||"Datei";
    await S.db.doc("maschinen/"+m.id).update({docs:[...(m.docs||[]),{id:uid(),name,fileId,teile:n,mime:f.type||"application/pdf",size:f.size}]});
    st.hidden=true;toast("Datei gespeichert.");
  }catch(err){st.hidden=false;st.textContent="Hochladen hat nicht geklappt. Prüf die Verbindung und versuch es noch einmal."}
});
/* Eigener Betrachter: PDFs und Fotos direkt in der App ansehen, ohne Download */
const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
let pdfLib=null;
async function ladePdfJs(){
  if(pdfLib)return pdfLib;
  await new Promise((ok,no)=>{const sc=document.createElement("script");sc.src=PDFJS+"pdf.min.js";sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
  const lib=window.pdfjsLib;
  try{const t=await (await fetch(PDFJS+"pdf.worker.min.js")).text();lib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([t],{type:"text/javascript"}))}catch(_){lib.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js"}
  return pdfLib=lib;
}
async function zeigeDatei(bytes,mime,name){
  const v=document.createElement("div");v.className="viewer";v.setAttribute("role","dialog");v.setAttribute("aria-modal","true");
  v.innerHTML=`<div class="vbar"><b>${esc(name||"Datei")}</b><span class="vz"><button data-vz="-1" aria-label="Verkleinern">−</button><button data-vz="1" aria-label="Vergrößern">+</button></span><button class="primary" data-vclose>Schließen</button></div><div class="vbody"><p class="note vlade">Wird geöffnet…</p></div>`;
  document.body.appendChild(v);document.body.style.overflow="hidden";
  const body=v.querySelector(".vbody");let url=null,zoom=1,pdf=null,lauf=0;
  const zu=()=>{v.remove();document.body.style.overflow="";if(url)URL.revokeObjectURL(url);removeEventListener("popstate",zu)};
  history.pushState({viewer:1},"");addEventListener("popstate",zu);
  v.querySelector("[data-vclose]").onclick=()=>history.back();
  if(/^image\//.test(mime)){
    v.querySelector(".vz").hidden=true;url=URL.createObjectURL(new Blob([bytes],{type:mime}));
    body.innerHTML=`<img src="${url}" alt="${esc(name||"")}">`;return;
  }
  const zeichne=async()=>{
    const my=++lauf;body.innerHTML="";const w=Math.min(body.clientWidth-16,1100)*zoom;const dpr=Math.min(devicePixelRatio||1,2);
    for(let n=1;n<=pdf.numPages;n++){
      if(my!==lauf)return;const page=await pdf.getPage(n);const vp0=page.getViewport({scale:1});const sc=w/vp0.width;const vp=page.getViewport({scale:sc*dpr});
      const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;c.style.width=(vp.width/dpr)+"px";c.style.height=(vp.height/dpr)+"px";
      body.appendChild(c);await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
    }
  };
  try{const lib=await ladePdfJs();pdf=await lib.getDocument({data:bytes}).promise;await zeichne()}
  catch(err){body.innerHTML=`<p class="note">Die Datei lässt sich hier nicht anzeigen. Ohne Internet geht das nur, wenn schon einmal ein PDF geöffnet wurde.</p>`;return}
  v.querySelector(".vz").onclick=e=>{const b=e.target.closest("[data-vz]");if(!b)return;zoom=Math.max(.5,Math.min(3,zoom+(+b.dataset.vz)*.25));zeichne()};
}
async function openFile(fileId,mime,name,btn){
  const doc=S.m.flatMap(m=>m.docs||[]).find(d=>d.fileId===fileId);if(!doc)return;
  btn.disabled=true;const old=btn.innerHTML;btn.textContent="Wird geladen…";
  try{
    let data="";for(let i=0;i<doc.teile;i++){const sn=await S.db.doc(`dateien/${fileId}_${i}`).get();if(!sn.exists)throw 0;data+=sn.data().data}
    const bin=atob(data);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    await zeigeDatei(arr,mime||"application/pdf",name);
  }catch(err){toast("Datei konnte nicht geladen werden. Ohne Netz geht das nur, wenn sie vorher schon einmal geöffnet wurde.")}
  btn.disabled=false;btn.innerHTML=old;
}

function arm(btn,label,fn){
  if(btn.dataset.armed){fn();return}
  btn.dataset.armed="1";const old=btn.textContent;btn.textContent=label;btn.classList.add("armed");

}

/* ---------- Firebase: Login, Daten, Push ---------- */
const CFG=self.FIREBASE_CONFIG||{};
const configured=CFG.apiKey&&!String(CFG.apiKey).includes("HIER");
let unsub=[];
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,6000)}

if(!configured){
  document.body.innerHTML='<div class="wrap" style="padding-block:40px"><h2>Fast fertig</h2><p>Trag in <b>firebase-config.js</b> noch die Daten aus deinem Firebase-Projekt ein (siehe Anleitung, Schritt 5).</p></div>';
}else{
  firebase.initializeApp(CFG);
  const auth=firebase.auth();
  S.db=firebase.firestore();
  S.db.enablePersistence({synchronizeTabs:true}).catch(()=>{});

  $("#lf").addEventListener("submit",async ev=>{
    ev.preventDefault();const btn=ev.submitter;btn.disabled=true;$("#lerr").hidden=true;
    try{await auth.signInWithEmailAndPassword($("#l_mail").value.trim(),$("#l_pw").value)}
    catch(e){$("#lerr").hidden=false;$("#lerr").textContent=/invalid|wrong|user-not-found/.test(e.code)?"E-Mail oder Passwort stimmt nicht.":e.code==="auth/too-many-requests"?"Zu viele Versuche. Warte ein paar Minuten.":"Anmelden hat nicht geklappt. Prüf die Internetverbindung."}
    btn.disabled=false;
  });
  $("#logout").addEventListener("click",()=>auth.signOut());

  auth.onAuthStateChanged(user=>{
    unsub.forEach(f=>f());unsub=[];
    $("#login").hidden=!!user;$("#app").hidden=!user;
    if(!user){S.m=[];S.e=[];S.l=[];S.ready=false;closeSheet();return}
    S.ready=false;render();
    let got=0;const done=()=>{if(++got===3){S.ready=true;$("#conn").textContent="Alle Änderungen werden sofort für die ganze Familie gespeichert.";migrate()}};
    const fail=e=>{$("#conn").textContent=e&&e.code==="permission-denied"?"Dieser Login hat keinen Zugriff auf die Hof-Daten.":"Keine Verbindung. Änderungen werden gespeichert, sobald du wieder online bist."};
    let f1=1,f2=1;
    unsub.push(S.db.collection("maschinen").onSnapshot(s=>{S.m=s.docs.map(d=>({id:d.id,...d.data()}));if(f1){f1=0;done()}render()},fail));
    let f3=1;unsub.push(S.db.collection("lager").onSnapshot(s=>{S.l=s.docs.map(d=>({id:d.id,...d.data()}));if(f3){f3=0;done()}render()},fail));
    unsub.push(S.db.collection("eintraege").onSnapshot(s=>{S.e=s.docs.map(d=>({id:d.id,...d.data()}));if(f2){f2=0;done()}render()},fail));
    initPush(false);
  });

  /* Einmalig: Dieselfilter als Wartungspunkt bei allen Maschinen mit Motor ergänzen */
async function migrate(){
  if(migrate.ran||!S.m.length)return;migrate.ran=1;
  try{
    const ref=S.db.doc("meta/migrationen");const snap=await ref.get();
    const done=snap.exists?snap.data():{};
    if(!done.kraftstoff){ /* Dieselfilter heißt jetzt Kraftstofffilter (auch für Benziner) */
      const b2=S.db.batch();
      for(const m of S.m)if(Array.isArray(m.wartung)&&m.wartung.some(p=>p.name==="Dieselfilter"))
        b2.update(S.db.doc("maschinen/"+m.id),{wartung:m.wartung.map(p=>p.name==="Dieselfilter"?{...p,name:"Kraftstofffilter",teil:p.teil||""}:p)});
      b2.set(ref,{kraftstoff:true,dieselfilter:true},{merge:true});await b2.commit();
    }
    /* Einmalig hinterlegte Unterlagen */
    const SEED_DOCS=[["jd6140m","traktor-2","Ersatzteilliste JD Parts (6140M)","https://share.google/p0KvNNjjdh4TqtJyv"],
      ["jd4240filter","jd-4240","Filterübersicht Serie 40 (PDF)","docs/jd-serie40-filteruebersicht.pdf"],
      ["jd4240licht","jd-4240","Beleuchtung Serie 40 (PDF)","docs/jd-serie40-beleuchtung.pdf"],
      ["jd4230filter","jd-4230","Filterübersicht & Füllmengen Serie 30 (PDF)","docs/jd-serie30-filteruebersicht.pdf"]];
    for(const[key,mid,name,url] of SEED_DOCS){
      if(done["doc_"+key])continue;const m=S.m.find(x=>x.id===mid);
      if(m&&!(m.docs||[]).some(d=>d.url===url))await S.db.doc("maschinen/"+mid).update({docs:[...(m.docs||[]),{id:uid(),name,url}]});
      await ref.set({["doc_"+key]:true},{merge:true});
    }

        const w=m.wartung.slice();const i=w.findIndex(p=>p.name==="Motoröl");
        w.splice(i<0?w.length:i+1,0,{id:uid(),name:"Kraftstofffilter",intervall:"12",naechste:""});
        b.update(S.db.doc("maschinen/"+m.id),{wartung:w});n++;
      }else{
        b.update(S.db.doc("maschinen/"+m.id),{wartung:STD_PUNKTE.map(([name,iv])=>({id:uid(),name,intervall:String(iv),naechste:""}))});n++;
      }
    }
    b.set(ref,{dieselfilter:true},{merge:true});
    await b.commit();
    if(n)toast(`Kraftstofffilter bei ${n} Maschinen als Wartungspunkt ergänzt.`);
  }catch(e){migrate.ran=0}
}

/* Startdaten aus der alten App übernehmen */
  document.addEventListener("change",async e=>{
    if(e.target.id!=="impFile"||!e.target.files[0])return;
    try{
      const data=JSON.parse(await e.target.files[0].text());
      const b=S.db.batch();let n=0;
      for(const[id,d] of Object.entries(data.maschinen||{})){b.set(S.db.doc("maschinen/"+id),d);n++}
      for(const[id,d] of Object.entries(data.eintraege||{}))b.set(S.db.doc("eintraege/"+id),d);
      await b.commit();toast(`${n} Maschinen übernommen.`);
    }catch(err){toast("Die Datei konnte nicht gelesen werden. Nimm die startdaten.json aus dem Paket.")}
  });
}

/* ---------- Service Worker + Push ---------- */
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
let swReg=null;
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").then(r=>swReg=r).catch(()=>{});

let pushReady=null;
async function initPush(ask){
  const btn=$("#pushBtn");
  if(!configured)return;
  if(pushReady===null){try{pushReady=await firebase.messaging.isSupported()}catch(_){pushReady=false}}
  btn.hidden=false;
  if(!pushReady){
    if(isIOS&&!standalone){btn.textContent="Benachrichtigungen";btn.onclick=()=>toast("Auf dem iPhone: Teilen-Symbol › „Zum Home-Bildschirm“. Dann die App von dort öffnen und hier Benachrichtigungen einschalten.")}
    else btn.hidden=true;
    return;
  }
  const perm=Notification.permission;
  if(perm==="denied"){btn.textContent="Benachrichtigungen blockiert";btn.classList.remove("on");btn.onclick=()=>toast("Du hast Benachrichtigungen blockiert. Erlaube sie in den Browser- oder Handy-Einstellungen für diese App.");return}
  const paint=on=>{btn.textContent=on?"Benachrichtigungen an":"Benachrichtigungen einschalten";btn.classList.toggle("on",on);
    btn.onclick=()=>on?toast("Benachrichtigungen sind auf diesem Gerät an. Ausschalten kannst du sie in den Einstellungen des Handys."):initPush(true)};
  paint(perm==="granted");
  if(perm!=="granted"&&!ask)return;
  try{
    if(perm!=="granted"&&await Notification.requestPermission()!=="granted"){paint(false);if(Notification.permission==="denied")initPush(false);return}
    const reg=await navigator.serviceWorker.ready; // erst wenn der Service Worker wirklich aktiv ist
    const messaging=firebase.messaging();
    const token=await messaging.getToken({vapidKey:self.VAPID_KEY,serviceWorkerRegistration:reg});
    if(token)await S.db.collection("geraete").doc(token).set({token,aktualisiert:new Date().toISOString(),geraet:navigator.userAgent.slice(0,140)});
    if(!initPush.listening){initPush.listening=1;messaging.onMessage(p=>toast(((p.notification||{}).title||"Maschinenpark")+": "+((p.notification||{}).body||"")))}
    paint(true);
    if(ask)toast("Benachrichtigungen sind an. Du bekommst Bescheid, wenn TÜV oder Wartung fällig werden.");
  }catch(e){console.error(e);btn.textContent="Benachrichtigungen einschalten";btn.classList.remove("on");btn.onclick=()=>initPush(true);if(ask)toast("Benachrichtigungen konnten nicht eingeschaltet werden ("+(e&&(e.code||e.message)||"unbekannt")+"). Schick mir den Text in Klammern.")}
}

if(configured)render();
</script>
